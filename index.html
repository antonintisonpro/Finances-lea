<style>
:root{--r:20px;--f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,Roboto,sans-serif}
:root,:root[data-mode=sombre]{color-scheme:dark;--bg:#03231b;--card:#062d23;--card2:#0a3529;--line:#123f33;--ink:#eaf0eb;--ink2:#b2c2b9;--ink3:#7b9488;--acc:#c9b27a;--onacc:#03231b;--rev:#8fd3b0;--neg:#f0a08f;--warn:#e3b45c;--veil:rgba(1,18,13,.62)}

:root[data-acc=sauge]{--acc:#8fc7a8}:root[data-acc=bleu]{--acc:#8fb4d9}:root[data-acc=rose]{--acc:#e0a3b0}:root[data-acc=cuivre]{--acc:#d39a6a}
:root[data-mode=clair][data-acc=sauge]{--acc:#2f7d5a}:root[data-mode=clair][data-acc=bleu]{--acc:#2f5f8f}:root[data-mode=clair][data-acc=rose]{--acc:#a8475e}:root[data-mode=clair][data-acc=cuivre]{--acc:#a0582a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f);font-weight:400;letter-spacing:-.005em;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 20px 12px;border-bottom:.5px solid var(--line)}
.top-row{display:flex;align-items:center;gap:8px}
.hello{flex:1;min-width:0}
.hello small{display:block;font-size:12px;color:var(--ink3)}
.hello h1{margin:2px 0 0;font-size:22px;font-weight:300;letter-spacing:-.02em}
.ibtn{appearance:none;border:.5px solid var(--line);background:none;color:var(--ink2);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.month{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.month button{appearance:none;border:0;background:none;color:var(--ink2);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.month div{text-align:center}
.month b{display:block;font-size:15px;font-weight:500;text-transform:capitalize}
.month small{display:block;font-size:11.5px;color:var(--ink3)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px;border-top:.5px solid var(--line);padding-top:10px}
.sum div{text-align:center}
.sum div>span{display:block;font-size:11px;color:var(--ink3)}
.sum b{font-size:16px;font-weight:400}
.sumoff .sum{display:none}
main{padding:16px 16px calc(110px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

.card{background:var(--card);border:.5px solid var(--line);border-radius:var(--r);padding:16px 16px}
.h2{font-size:15px;font-weight:500;margin:0 0 2px;letter-spacing:-.005em;display:flex;align-items:center;gap:8px}
.sub{font-size:13px;color:var(--ink3);margin:0 0 10px;line-height:1.45}
.grp{font-size:12px;color:var(--ink3);font-weight:400;margin:0 0 6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero{padding:20px 18px 16px}

.q{appearance:none;width:20px;height:20px;min-width:20px;padding:0;border-radius:50%;border:.5px solid var(--acc);background:none;color:var(--acc);font-size:12px;line-height:1;cursor:pointer;display:inline-grid;place-items:center}
.lnk{appearance:none;border:0;background:none;color:var(--acc);font-size:13px;padding:4px 0;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px}
.bar div{height:100%;border-radius:2px;background:var(--acc)}
.bud{padding:11px 0;border-top:.5px solid var(--line)}

.it .t{flex:1;min-width:0}
.it .t b{display:block;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .t>span{font-size:12.5px;color:var(--ink3)}
.m-dep,.m-rev{font-weight:400;white-space:nowrap}
.m-dep{color:var(--ink)}.m-rev{color:var(--rev)}
.pt{appearance:none;border:0;background:none;padding:6px 0 6px 2px;color:var(--ink3);cursor:pointer;flex:none}
.pt.on{color:var(--acc)}
.pt .i{width:20px;height:20px}

.tag.remb{border-color:var(--acc);color:var(--acc)}
.tag.late{border-color:var(--neg);color:var(--neg);font-weight:600}

.empty{color:var(--ink3);font-size:13.5px;padding:6px 0}
.hb{display:grid;grid-template-columns:110px 1fr auto;align-items:center;gap:10px;font-size:13px;margin-top:9px}
.hb>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.hb .t{height:3px;border-radius:2px;background:var(--acc);min-width:2px}

.chart svg{display:block;width:100%}

.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:var(--onacc);display:grid;place-items:center;cursor:pointer}
.fab .i{width:26px;height:26px;stroke-width:1.6}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg);border-top:.5px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:10px;color:var(--ink3);cursor:pointer}

.chips button.on{border-color:var(--acc);color:var(--acc)}
.chips button.add,.cats button.add{border-style:dashed;color:var(--acc)}
.chips.quick small{color:var(--ink3)}
.sw{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:14px;gap:12px}
.sw input{width:22px;height:22px;accent-color:var(--acc);flex:none}
.sw span small{display:block;font-size:12px;color:var(--ink3);margin-top:1px}
label.l{display:block;font-size:12px;color:var(--ink3);margin:14px 0 5px}
input.f,select.f,textarea.f,.search{width:100%;border:.5px solid var(--line);border-radius:14px;padding:11px 13px;font-size:16px;background:var(--card2);-webkit-appearance:none;appearance:none;outline:none}

.search{margin-bottom:8px;border:0}
input.big{font-size:38px;font-weight:200;letter-spacing:-.03em;text-align:center;padding:12px;background:none;border:0}
.auto{font-size:12.5px;color:var(--acc);text-align:center;margin:8px 0 8px;min-height:18px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cats button{appearance:none;border:.5px solid var(--line);background:none;border-radius:14px;padding:10px 2px 8px;font-size:11px;color:var(--ink2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;overflow:hidden}

.btn{appearance:none;border:0;background:var(--acc);color:var(--onacc);font-weight:500;font-size:15.5px;border-radius:14px;padding:14px;width:100%;margin-top:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:none;color:var(--ink2);border:.5px solid var(--line)}

.small{appearance:none;border:.5px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink2);cursor:pointer}
.sheet-bg{position:fixed;inset:0;z-index:30;background:var(--veil);display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;max-width:720px;margin:0 auto;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));border-top:.5px solid var(--line)}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}

.lock{position:fixed;inset:0;z-index:50;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}

.lock .logo .i{width:30px;height:30px}
.lock h2{margin:16px 0 4px;font-size:20px;font-weight:300}

.dots{display:flex;gap:14px;margin-bottom:26px}
.dots i{width:11px;height:11px;border-radius:50%;border:1px solid var(--ink3)}

.pad{display:grid;grid-template-columns:repeat(3,74px);gap:14px}

.pad button:empty{visibility:hidden}
.pad button[data-k="⌫"]{border:0}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.faceid{appearance:none;border:.5px solid var(--acc);background:none;color:var(--acc);border-radius:999px;padding:11px 20px;font-size:14.5px;margin-bottom:18px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.lock .hint{font-size:13px;margin:-8px 0 14px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:.5px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.kv b{font-weight:400;text-align:right}
.kv>span{color:var(--ink2)}
.kv.tot{border-top-color:var(--ink3)}
.kv.tot b,.kv.tot>span{color:var(--acc)}
.goal{padding:12px 0;border-top:.5px solid var(--line)}
.goal:first-child{border-top:0}
.goal .row>b{font-weight:400;display:flex;align-items:center;gap:8px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:.5px solid var(--line);border-radius:var(--r);padding:14px}
.kpi>span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3)}

.up{color:var(--rev)}.down{color:var(--neg)}

.recap{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}

.recap b{font-weight:300;font-size:16px}
.calsum{display:grid;grid-template-columns:repeat(3,1fr);border:.5px solid var(--line);border-radius:16px;margin:10px 0 14px;overflow:hidden}
.calsum div{text-align:center;padding:12px 4px 10px}
.calsum div>span{display:block;font-size:11.5px;color:var(--ink3)}
.calsum b{font-size:18px;font-weight:300}
.calsum .on{box-shadow:inset 0 -1.5px 0 var(--acc)}
.calsum .on b{color:var(--acc)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}

.cal b{font-weight:300;font-size:14px}
.cal .hors{color:var(--ink3);opacity:.4;cursor:default;background:none}

.cal u.rv{background:var(--rev)}
.cal button.passe{opacity:.5}
.cal button.auj{box-shadow:inset 0 0 0 .5px var(--ink3);opacity:1}

.cal button.sel{box-shadow:inset 0 0 0 1px var(--acc);opacity:1}
.nv{display:flex;gap:14px;padding:12px 0;border-top:.5px solid var(--line);align-items:flex-start}
.nv:first-of-type{border-top:0}
.nv b{display:block;font-weight:500;font-size:14.5px}
.nv div>span{display:block;font-size:13px;color:var(--ink2);line-height:1.45;margin-top:2px}
.tuto p{margin:0 0 12px;font-size:14.5px;line-height:1.5}
.tuto b{font-weight:500}
.rappel{border-color:var(--acc)}
.badge-imp{display:inline-block;border:.5px solid var(--acc);color:var(--acc);font-size:11px;letter-spacing:.06em;padding:3px 10px;border-radius:999px;margin-bottom:10px;text-transform:uppercase}
.pop-ico{width:56px;height:56px;margin:6px auto 10px;border-radius:50%;border:.5px solid var(--acc);color:var(--acc);display:grid;place-items:center}

.pop-t{font-size:20px;font-weight:300;text-align:center;margin:0 0 8px}

.dleg b{font-weight:400}
.dleg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}
.icogrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:50vh;overflow:auto;padding:4px 0}

.emobtn{appearance:none;border:.5px solid var(--line);background:none;border-radius:16px;width:58px;height:58px;cursor:pointer;display:grid;place-items:center;color:var(--acc)}
.emobtn .i{width:24px;height:24px}
.acc{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:.5px solid var(--line);cursor:pointer}
.acc:first-child{border-top:0}
.acc .t{flex:1;min-width:0}.acc .t b{display:block;font-weight:400}.acc .t>span{font-size:12.5px;color:var(--ink3)}
.acc>b{font-weight:400}
.colors{display:flex;gap:10px;margin-top:6px}
.colors button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 3px var(--card)}
.colors button.on{border-color:var(--ink2)}
.rg-sec{font-size:12px;color:var(--acc);margin:24px 0 2px;padding-top:16px;border-top:.5px solid var(--line)}
.rg-note{font-size:12.5px;color:var(--ink3);margin:4px 0 0}
.rule{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:.5px solid var(--line);font-size:14px}
.rule:first-child{border-top:0}
.rule .t{flex:1;min-width:0}
.rule .t>span{display:block;font-size:12.5px;color:var(--ink3)}
.amt{transition:filter .25s}

:root.ludi .emo{border:0;background:color-mix(in srgb,var(--t,var(--acc)) 22%,var(--card2));border-radius:13px}
.emo:has(.em){border:0;border-radius:13px;background:color-mix(in srgb,var(--acc) 14%,var(--card2))}
.em{font-size:19px;line-height:1;display:grid;place-items:center;width:100%;height:100%;border-radius:13px;background:color-mix(in srgb,var(--t) 24%,transparent)}
.cats button .em{width:38px;height:38px;font-size:22px}
.chips button .em{width:20px;height:20px;font-size:14px;background:none}

  return dates.map((d) => ({d, v: DB.comptes.reduce((s, c) => { const h = c.hist.filter((x) => x.d <= d).pop(); return s + (h ? h.v : 0); }, 0)}));
}
function chartPatri() {
  const h = patriHist();

  const max = niceMax(Math.max(...h.map((x) => x.v)) * 1.05);
  const t = (d) => Date.parse(d), a = t(h[0].d), b = t(h[h.length - 1].d) || a + 1;
  const x = (d) => ml + (W - ml - 6) * ((t(d) - a) / (b - a || 1)), y = (v) => t0 + (H - t0 - bt) * (1 - v / max);

  [0, max / 2, max].forEach((v) => { s += `<line x1="${ml}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width=".5"/><text class="ax" x="${ml - 5}" y="${y(v) + 4}" text-anchor="end">${v >= 1000 ? Math.round(v / 1000).toLocaleString('fr-FR') + ' k' : Math.round(v)}</text>`; });
  s += `<polygon points="${x(h[0].d)},${y(0)} ${h.map((p) => x(p.d) + ',' + y(p.v)).join(' ')} ${x(h[h.length - 1].d)},${y(0)}" fill="var(--acc)" opacity=".12"/>`;
  s += `<polyline points="${h.map((p) => x(p.d) + ',' + y(p.v)).join(' ')}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>`;
  s += `<text x="${ml}" y="${H - 5}">${new Date(h[0].d).toLocaleDateString('fr-FR', {month: 'short', year: '2-digit'})}</text><text x="${W}" y="${H - 5}" text-anchor="end">${new Date(h[h.length - 1].d).toLocaleDateString('fr-FR', {month: 'short', year: '2-digit'})}</text>`;
  return s + '</svg>';
}

/* ---------- Dépenses qui reviennent : proposées en fixes ---------- */
const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
function recurrents() {
  const lim = addMois(ym(today()), -5), g = {}, ign = DB.reglages.recIgn || [];
  DB.tx.filter((t) => !t.fixe && !t.rembDe && ym(t.date) >= lim && norm(t.note).length >= 3).forEach((t) => { const k = t.type + '|' + norm(t.note); (g[k] = g[k] || []).push(t); });
  const fx = DB.fixes.map((f) => norm(f.note));
  return Object.entries(g).map(([k, l]) => {
    l.sort((a, b) => a.date.localeCompare(b.date));
    const ms = [...new Set(l.map((t) => ym(t.date)))], last = l[l.length - 1];
    const proches = l.slice(-2).length === 2 && Math.abs(l[l.length - 1].montant - l[l.length - 2].montant) <= Math.max(1, l[l.length - 2].montant * 0.1);
    const consec = ms.length >= 2 && addMois(ms[ms.length - 2], 1) === ms[ms.length - 1];
    const parMois = Math.max(...ms.map((m) => l.filter((t) => ym(t.date) === m).length));
    const mt = l.map((t) => t.montant).sort((x, y) => x - y), med = mt[Math.floor(mt.length / 2)];
    const stable = (mt[mt.length - 1] - mt[0]) <= Math.max(1, med * 0.15);
    const recent = ms[ms.length - 1] >= addMois(ym(today()), -1);
    const ok = parMois === 1 && stable && recent && (ms.length >= 3 || (consec && proches));
    const jours = l.map((t) => Number(t.date.slice(8))).sort((a, b) => a - b);
    return ok ? {k, type: last.type, note: last.note.trim(), cat: last.cat, montant: last.montant, jour: jours[Math.floor(jours.length / 2)], n: ms.length} : null;
  }).filter((x) => x && !ign.includes(x.k) && !fx.includes(norm(x.note))).sort((a, b) => b.n - a.n);
}

/* ---------- Règles automatiques : libellé → catégorie ---------- */
function autoCat(note, type) {
  const n = norm(note); if (n.length < 2) return null;
  const r = DB.regles.find((x) => n.includes(norm(x.mot)) && cat(x.cat).type === type);
  if (r) return {cat: r.cat, src: 'règle « ' + r.mot + ' »'};
  const l = DB.tx.filter((t) => t.type === type && t.note).sort((a, b) => b.date.localeCompare(a.date));
  let t = l.find((x) => norm(x.note) === n);
  const w = n.split(' ')[0];
  if (!t && w.length >= 3) t = l.find((x) => norm(x.note).split(' ')[0] === w);
  return t && DB.cats.some((c) => c.id === t.cat) ? {cat: t.cat, src: 'déjà vu'} : null;
}

async function hash(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('mf:' + s)); return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join(''); }
const BIOK = 'mes_finances_bio';
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function bioCreate() {
  try {
    if (!window.PublicKeyCredential || !(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())) return false;
    const cred = await navigator.credentials.create({publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)), rp: {name: 'Mes Finances'},
      user: {id: crypto.getRandomValues(new Uint8Array(16)), name: 'moi', displayName: 'Mes Finances'},
      pubKeyCredParams: [{type: 'public-key', alg: -7}, {type: 'public-key', alg: -257}],
      authenticatorSelection: {authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged'}, timeout: 60000
    }});
    localStorage.setItem(BIOK, b64(cred.rawId));
    return true;
  } catch (e) { return false; }
}
async function bioCheck() {
  const id = localStorage.getItem(BIOK);
  if (!id) return false;
  try {
    await navigator.credentials.get({publicKey: {challenge: crypto.getRandomValues(new Uint8Array(32)), allowCredentials: [{type: 'public-key', id: unb64(id)}], userVerification: 'required', timeout: 60000}});
    return true;
  } catch (e) { return false; }
}

document.addEventListener('change', (e) => {
  if (e.target.matches('[data-fcat]')) { S.fCat = e.target.value; renderMouv(); }
  if (e.target.matches('[data-seuil]')) { const v = Math.round(num(e.target.value)); DB.reglages.seuil = v >= 10 && v <= 100 ? v : 80; save(); renderAccueil(); renderBudgets(); toast('Alerte à ' + DB.reglages.seuil + ' % ✓'); return; }
  if (e.target.matches('[data-bud]')) { const c = DB.cats.find((x) => x.id === e.target.dataset.bud); const v = num(e.target.value || 0); c.budget = v > 0 ? v : 0; save(); renderHead(); renderAccueil(); renderBudgets(); toast('Budget enregistré ✓'); }
});
$('fab').onclick = () => openTx();
$('btn-reglages').onclick = openReglages;
$('btn-oeil').onclick = basculerFlou;
$('m-prev').onclick = () => { S.mois = addMois(S.mois, -1); renderAll(); };
matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => applyTheme());
$('m-next').onclick = () => { S.mois = addMois(S.mois, 1); renderAll(); };

load(); renderAll(); checkNouveautes();
startLock(localStorage.getItem(PINK) ? 'check' : 'new');
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
